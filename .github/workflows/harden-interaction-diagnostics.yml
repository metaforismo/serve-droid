name: Harden interaction diagnostics

on:
  push:
    branches:
      - feat/typed-interaction-errors
    paths:
      - .github/workflows/harden-interaction-diagnostics.yml

permissions:
  contents: write

env:
  PNPM_VERSION: 10.28.0

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: python scripts/harden-interaction-diagnostics.py
      - name: Verify the hardened path
        run: |
          pnpm exec prettier --write \
            packages/core/src/interaction-errors.ts \
            packages/core/test/interaction-errors.test.ts
          pnpm exec eslint \
            packages/core/src/interaction-errors.ts \
            packages/core/test/interaction-errors.test.ts
          pnpm typecheck
          pnpm exec vitest run \
            packages/core/test/interaction-errors.test.ts \
            packages/server/test/typed-input-errors.test.ts
      - name: Commit product changes
        shell: bash
        run: |
          git add \
            packages/core/src/interaction-errors.ts \
            packages/core/test/interaction-errors.test.ts
          if git diff --cached --quiet; then
            echo "Interaction diagnostics are already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep interaction diagnostics best-effort"
          git push origin HEAD:feat/typed-interaction-errors
