name: Complete two-finger checklist

on:
  push:
    branches:
      - feat/two-finger-gestures

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mark the implemented release item complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/TODO.md")
          content = path.read_text(encoding="utf-8")
          pending = "- [ ] Add two-finger control-channel gesture injection."
          completed = "- [x] Add two-finger control-channel gesture injection."
          if pending not in content:
              raise SystemExit("Expected pending checklist item was not found")
          path.write_text(content.replace(pending, completed, 1), encoding="utf-8")
          PY
          pnpm exec prettier --write docs/TODO.md
      - name: Commit checklist update
        shell: bash
        run: |
          git add docs/TODO.md
          if git diff --cached --quiet; then
            echo "Checklist is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mark two-finger gestures complete"
          git push origin HEAD:feat/two-finger-gestures
