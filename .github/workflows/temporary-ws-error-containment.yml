name: Temporary WebSocket error containment

on:
  push:
    branches:
      - hardening/remaining-transport-bounds

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/remaining-transport-bounds
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Contain accepted WebSocket errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/server/src/server.ts")
          text = path.read_text()

          old = '''    this.#videoWebSocket.on("connection", (socket) => {\n      let unregister: (() => void) | undefined;'''
          new = '''    this.#videoWebSocket.on("connection", (socket) => {\n      socket.on("error", () => undefined);\n      let unregister: (() => void) | undefined;'''
          if old not in text:
              raise SystemExit("video connection block not found")
          text = text.replace(old, new, 1)

          old = '''    this.#controlWebSocket.on("connection", (socket) => {\n      socket.on("message", (message) => {'''
          new = '''    this.#controlWebSocket.on("connection", (socket) => {\n      socket.on("error", () => undefined);\n      socket.on("message", (message) => {'''
          if old not in text:
              raise SystemExit("control connection block not found")
          text = text.replace(old, new, 1)

          old = '''    this.#audioWebSocket.on("connection", (socket) => {\n      socket.send('''
          new = '''    this.#audioWebSocket.on("connection", (socket) => {\n      socket.on("error", () => undefined);\n      socket.send('''
          if old not in text:
              raise SystemExit("audio connection block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/server/src/server.ts
          rm .github/workflows/temporary-ws-error-containment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server.ts .github/workflows/temporary-ws-error-containment.yml
          git diff --cached --quiet || git commit -m "Contain accepted WebSocket errors"
          git push origin HEAD:hardening/remaining-transport-bounds
