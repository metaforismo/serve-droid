name: Temporary Node 26 buffer typing fixer

on:
  push:
    branches: [feature/rich-trace-export]

permissions:
  contents: write

jobs:
  patch-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rich-trace-export
      - name: Apply narrow type fix and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/server/src/trace.ts')
          source = path.read_text()
          old = '    let buffered = Buffer.alloc(0);'
          new = '    let buffered: Buffer<ArrayBufferLike> = Buffer.alloc(0);'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one accumulator declaration')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/tmp-node26-buffer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/server/src/trace.ts .github/workflows/tmp-node26-buffer-fix.yml
          git commit -m "Fix Node 26 stream buffer typing"
          git push origin HEAD:feature/rich-trace-export
