name: Temporary transport docs

on:
  push:
    branches:
      - hardening/public-transport-boundaries

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/public-transport-boundaries
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Update protocol and evidence checklist
        run: |
          python3 - <<'PY'
          from pathlib import Path

          protocol = Path("docs/protocol.md")
          text = protocol.read_text()
          old = """Browser WebSockets pass `serve-droid, token.<base64url-token>` in `Sec-WebSocket-Protocol`.\nCredentials never appear in URL query parameters.\n"""
          new = old + """\nAuthenticated JSON mutation bodies and control WebSocket messages must decode to JSON objects.\nMalformed JSON and valid non-object JSON such as `null` or arrays fail as `INVALID_ARGUMENT` before\ndevice input is attempted.\n"""
          if old not in text:
              raise SystemExit("protocol auth paragraph not found")
          text = text.replace(old, new, 1)

          old = """Uploads use `application/octet-stream` with `X-File-Name`. APKs install; other files are pushed to\n`/sdcard/Download`. The limit is 256 MiB. Browser clients report byte-accurate request upload\nprogress, then switch to a distinct indeterminate install or push phase while waiting for ADB. The\nserver does not invent a percentage for Android-side work. Successful responses identify the\n`install` or `push` operation and include the remote destination for pushed files.\n"""
          new = """Uploads use `application/octet-stream` with `X-File-Name`. APKs install; other files are pushed to\n`/sdcard/Download`. The limit is 256 MiB. Malformed URI encoding or NUL-containing file names fail\nas `INVALID_ARGUMENT` before a temporary file or ADB operation is created. Browser clients report\nbyte-accurate request upload progress, then switch to a distinct indeterminate install or push phase\nwhile waiting for ADB. The server does not invent a percentage for Android-side work. Successful\nresponses identify the `install` or `push` operation and include the remote destination for pushed\nfiles.\n"""
          if old not in text:
              raise SystemExit("protocol upload paragraph not found")
          text = text.replace(old, new, 1)

          old = """Log streams are scoped to the current foreground package and PID by default. Pass `package=<id>` to\nfollow a different package or `system=true` to opt into unfiltered system logs. These options are\nmutually exclusive. A successful launch, package deep link, stop, clear, or uninstall invalidates\nthe cached PID; tracked packages attempt to resolve the replacement PID before the action completes\nand retry safely when new entries arrive, so a long-lived stream cannot continue accepting entries\nfrom the previous process. CLI `logs` and MCP `android_read_logs` use the foreground package by\ndefault, accept an explicit package override, and require an explicit `--system` or `system: true`\nopt-in for unfiltered logs.\n"""
          new = old + """\nHTTP Logcat streams emit Server-Sent Event `id` fields equal to each log cursor. A reconnect can send\n`Last-Event-ID`; the server resumes after the newer valid cursor from that header or the explicit\n`since` query parameter. If `ServerResponse.write()` reports backpressure, the server ends that SSE\nresponse and removes its live-log subscription instead of accumulating an unbounded response queue.\nThis is a bounded-memory and resume contract, not a claim of lossless delivery across disconnects.\n"""
          if old not in text:
              raise SystemExit("protocol log paragraph not found")
          text = text.replace(old, new, 1)
          protocol.write_text(text)

          todo = Path("docs/TODO.md")
          text = todo.read_text()
          old = "- [ ] Test backpressure and malformed input across every public transport."
          new = """- [x] Reject malformed or non-object JSON consistently across authenticated HTTP and control\n      WebSocket actions, and reject malformed upload-name encoding before file or ADB work.\n- [x] Bound slow Logcat SSE clients and expose resumable event cursors.\n- [ ] Audit remaining video, audio, decoded-frame, and MCP malformed-input/backpressure boundaries."""
          if old not in text:
              raise SystemExit("TODO transport line not found")
          todo.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write docs/protocol.md docs/TODO.md
          rm .github/workflows/temporary-transport-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/protocol.md docs/TODO.md .github/workflows/temporary-transport-docs.yml
          git diff --cached --quiet || git commit -m "Document bounded public transport behavior"
          git push origin HEAD:hardening/public-transport-boundaries
