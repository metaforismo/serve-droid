name: Temporary install push progress integration

on:
  push:
    branches:
      - feature/install-push-progress

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/install-push-progress
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Integrate progress contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path("packages/server/src/server.ts")
          text = server.read_text()
          anchor = '''import {\n  DECODED_FRAME_DEFAULT_QUALITY,\n  DECODED_FRAME_DEFAULT_WIDTH,\n  DECODED_FRAME_MAX_PAYLOAD,\n  DecodedFrameBroker,\n  isDecodedFrameProviderHello,\n  jpegDimensions,\n} from "./decoded-frame.js";\n'''
          addition = anchor + '''import {\n  acceptsFileProgressStream,\n  fileProgressEvent,\n  startFileProgressStream,\n  writeFileProgressFrame,\n  type FileOperation,\n} from "./file-progress.js";\n'''
          if anchor not in text:
              raise SystemExit("server decoded-frame import anchor not found")
          text = text.replace(anchor, addition, 1)
          old = '''      } else if (url.pathname === "/api/v1/files" && request.method === "POST") {\n        json(response, 200, await this.#file(request));\n'''
          new = '''      } else if (url.pathname === "/api/v1/files" && request.method === "POST") {\n        await this.#file(request, response);\n'''
          if old not in text:
              raise SystemExit("server files route not found")
          text = text.replace(old, new, 1)
          old = '''  async #file(request: IncomingMessage): Promise<unknown> {\n    const name = decodeUploadName(String(request.headers["x-file-name"] ?? ""));\n    const directory = await mkdtemp(join(tmpdir(), "serve-droid-upload-"));\n    const path = join(directory, name);\n    try {\n      await writeFile(path, await readBody(request, FILE_LIMIT), { flag: "wx", mode: 0o600 });\n      if (name.toLocaleLowerCase().endsWith(".apk")) {\n        await this.service.actions.install(path);\n        this.#recorder?.recordEvent("file", { operation: "install-apk" });\n        return { schemaVersion: SCHEMA_VERSION, ok: true, operation: "install" };\n      }\n      const destination = await this.service.actions.push(path);\n      this.#recorder?.recordEvent("file", { operation: "push" });\n      return { schemaVersion: SCHEMA_VERSION, ok: true, operation: "push", destination };\n    } finally {\n      await rm(directory, { recursive: true, force: true });\n    }\n  }\n'''
          new = '''  async #file(request: IncomingMessage, response: ServerResponse): Promise<void> {\n    const name = decodeUploadName(String(request.headers["x-file-name"] ?? ""));\n    const directory = await mkdtemp(join(tmpdir(), "serve-droid-upload-"));\n    const path = join(directory, name);\n    try {\n      await writeFile(path, await readBody(request, FILE_LIMIT), { flag: "wx", mode: 0o600 });\n      const operation: FileOperation = name.toLocaleLowerCase().endsWith(".apk") ? "install" : "push";\n      const execute = async (): Promise<unknown> => {\n        if (operation === "install") {\n          await this.service.actions.install(path);\n          this.#recorder?.recordEvent("file", { operation: "install-apk" });\n          return { schemaVersion: SCHEMA_VERSION, ok: true, operation };\n        }\n        const destination = await this.service.actions.push(path);\n        this.#recorder?.recordEvent("file", { operation: "push" });\n        return { schemaVersion: SCHEMA_VERSION, ok: true, operation, destination };\n      };\n\n      if (!acceptsFileProgressStream(request.headers.accept)) {\n        json(response, 200, await execute());\n        return;\n      }\n\n      startFileProgressStream(response);\n      const activePhase = operation === "install" ? "installing" : "pushing";\n      writeFileProgressFrame(\n        response,\n        "progress",\n        fileProgressEvent(\n          operation,\n          activePhase,\n          operation === "install" ? "Installing APK on Android." : "Pushing file to Android.",\n        ),\n      );\n      try {\n        const result = await execute();\n        writeFileProgressFrame(\n          response,\n          "progress",\n          fileProgressEvent(\n            operation,\n            "completed",\n            operation === "install" ? "Install complete." : "Push complete.",\n          ),\n        );\n        writeFileProgressFrame(response, "result", result);\n      } catch (error) {\n        const envelope = errorBody(error);\n        writeFileProgressFrame(\n          response,\n          "progress",\n          fileProgressEvent(operation, "failed", envelope.error.message),\n        );\n        writeFileProgressFrame(response, "error", envelope);\n      } finally {\n        response.end();\n      }\n    } finally {\n      await rm(directory, { recursive: true, force: true });\n    }\n  }\n'''
          if old not in text:
              raise SystemExit("server file handler not found")
          server.write_text(text.replace(old, new, 1))

          mcp = Path("packages/mcp/src/server.ts")
          text = mcp.read_text()
          anchor = 'import { BoundedStdioServerTransport } from "./bounded-stdio.js";\n'
          if anchor not in text:
              raise SystemExit("MCP transport import anchor not found")
          text = text.replace(anchor, anchor + 'import { reportMcpProgress } from "./progress.js";\n', 1)
          old = '''    async ({ device, operation, packageName = "", path = "", activity, url = "", confirm }) => {\n      const actions = (await selectedService(device)).current.actions;\n      if ((operation === "clear" || operation === "uninstall") && !confirm) {\n        throw new Error(`${operation} requires confirm=true.`);\n      }\n      if (operation === "install") await actions.install(path);\n      else if (operation === "launch") await actions.launch(packageName, activity);\n'''
          new = '''    async (\n      { device, operation, packageName = "", path = "", activity, url = "", confirm },\n      extra,\n    ) => {\n      const actions = (await selectedService(device)).current.actions;\n      if ((operation === "clear" || operation === "uninstall") && !confirm) {\n        throw new Error(`${operation} requires confirm=true.`);\n      }\n      if (operation === "install") {\n        await reportMcpProgress(extra, 1, 2, "Installing APK on Android.");\n        await actions.install(path);\n        await reportMcpProgress(extra, 2, 2, "Install complete.");\n      } else if (operation === "launch") await actions.launch(packageName, activity);\n'''
          if old not in text:
              raise SystemExit("MCP app handler anchor not found")
          text = text.replace(old, new, 1)
          old = '''    async ({ device, localPath, remoteDirectory }) =>\n      text({\n        schemaVersion: 1,\n        destination: await (\n          await selectedService(device)\n        ).current.actions.push(localPath, remoteDirectory),\n      }),\n'''
          new = '''    async ({ device, localPath, remoteDirectory }, extra) => {\n      await reportMcpProgress(extra, 1, 2, "Pushing file to Android.");\n      const destination = await (\n        await selectedService(device)\n      ).current.actions.push(localPath, remoteDirectory);\n      await reportMcpProgress(extra, 2, 2, "Push complete.");\n      return text({ schemaVersion: 1, destination });\n    },\n'''
          if old not in text:
              raise SystemExit("MCP push handler anchor not found")
          mcp.write_text(text.replace(old, new, 1))

          test = Path("packages/mcp/test/server.test.ts")
          text = test.read_text()
          anchor = '''  it("uses the ADB screenshot path when no browser session is active", async () => {\n'''
          block = '''  it("emits standard progress notifications for requested install and push operations", async () => {\n    const state = fixture();\n    const client = await connectedClient(state.runtime);\n    const installProgress: unknown[] = [];\n    const pushProgress: unknown[] = [];\n\n    const installed = await client.callTool(\n      {\n        name: "android_manage_app",\n        arguments: { operation: "install", path: "/tmp/example.apk" },\n      },\n      undefined,\n      { onprogress: (progress) => installProgress.push(progress) },\n    );\n    expect(installed.isError).not.toBe(true);\n\n    const pushed = await client.callTool(\n      {\n        name: "android_push_file",\n        arguments: { localPath: "/tmp/example.txt" },\n      },\n      undefined,\n      { onprogress: (progress) => pushProgress.push(progress) },\n    );\n    expect(pushed.isError).not.toBe(true);\n\n    expect(installProgress).toEqual([\n      { progress: 1, total: 2, message: "Installing APK on Android." },\n      { progress: 2, total: 2, message: "Install complete." },\n    ]);\n    expect(pushProgress).toEqual([\n      { progress: 1, total: 2, message: "Pushing file to Android." },\n      { progress: 2, total: 2, message: "Push complete." },\n    ]);\n  });\n\n'''
          if anchor not in text:
              raise SystemExit("MCP test insertion anchor not found")
          test.write_text(text.replace(anchor, block + anchor, 1))
          PY
          pnpm exec prettier --write packages/server/src/server.ts packages/server/src/file-progress.ts packages/server/test/file-progress.test.ts packages/web/src/api.ts packages/web/src/sse.ts packages/web/test/sse.test.ts packages/mcp/src/server.ts packages/mcp/src/progress.ts packages/mcp/test/progress.test.ts packages/mcp/test/server.test.ts
          rm .github/workflows/temporary-install-push-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server.ts packages/server/src/file-progress.ts packages/server/test/file-progress.test.ts packages/web/src/api.ts packages/web/src/sse.ts packages/web/test/sse.test.ts packages/mcp/src/server.ts packages/mcp/src/progress.ts packages/mcp/test/progress.test.ts packages/mcp/test/server.test.ts .github/workflows/temporary-install-push-progress.yml
          git diff --cached --quiet || git commit -m "Integrate install and push progress events"
          git push origin HEAD:feature/install-push-progress
