name: Temporary cockpit test formatter

on:
  push:
    branches: [design/cockpit-v2]

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/cockpit-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Format layout test and self-remove
        run: |
          pnpm exec prettier --write packages/web/e2e/cockpit-layout.pw.ts
          rm .github/workflows/tmp-cockpit-test-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/web/e2e/cockpit-layout.pw.ts .github/workflows/tmp-cockpit-test-format.yml
          git commit -m "Apply cockpit layout test formatting"
          git push origin HEAD:design/cockpit-v2
