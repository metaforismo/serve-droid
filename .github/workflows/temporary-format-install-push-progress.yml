name: Temporary install push progress formatter

on:
  push:
    branches:
      - feature/install-push-progress

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/install-push-progress
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Format and remove temporary workflow
        run: |
          pnpm exec prettier --write packages/server/test/transport-server.test.ts
          rm .github/workflows/temporary-format-install-push-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/test/transport-server.test.ts .github/workflows/temporary-format-install-push-progress.yml
          git diff --cached --quiet || git commit -m "Format install and push progress tests"
          git push origin HEAD:feature/install-push-progress
