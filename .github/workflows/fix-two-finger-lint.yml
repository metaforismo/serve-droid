name: Fix two-finger lint

on:
  push:
    branches:
      - feat/two-finger-gestures

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply ESLint and Prettier fixes
        run: |
          pnpm exec eslint packages/server/src/control.ts --fix
          pnpm exec prettier --write packages/server/src/control.ts
      - name: Commit fixes when needed
        shell: bash
        run: |
          git add packages/server/src/control.ts
          if git diff --cached --quiet; then
            echo "No automatic lint fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix two-finger controller lint"
          git push origin HEAD:feat/two-finger-gestures
