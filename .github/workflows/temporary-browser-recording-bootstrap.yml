name: Temporary browser recording controls bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/browser-recording-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/browser-recording-controls
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Run the staged patch and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-browser-recording-controls.yml').read_text()
          marker = '      - name: Apply recording controls\n        run: |\n'
          if marker not in source:
              raise SystemExit('recording-controls run block not found')
          block = source.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-browser-recording-controls.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-browser-recording-controls.sh
          rm .github/workflows/temporary-browser-recording-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary recording controls bootstrap"
          git push origin HEAD:feature/browser-recording-controls
