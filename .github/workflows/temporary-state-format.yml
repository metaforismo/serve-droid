name: Temporary state formatter

on:
  push:
    branches:
      - hardening/stale-session-state

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/stale-session-state
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Format and remove temporary workflow
        run: |
          pnpm exec prettier --write packages/server/src/state.ts
          rm .github/workflows/temporary-state-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/state.ts .github/workflows/temporary-state-format.yml
          git diff --cached --quiet || git commit -m "Format persisted session state"
          git push origin HEAD:hardening/stale-session-state
