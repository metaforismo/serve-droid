name: Temporary format fixer

on:
  push:
    branches: [feature/rich-trace-export]

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rich-trace-export
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter and remove temporary workflow
        run: |
          pnpm exec prettier --write packages/server/src/recording.ts
          rm .github/workflows/tmp-format-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/server/src/recording.ts .github/workflows/tmp-format-probe.yml
          git commit -m "Apply repository Prettier formatting"
          git push origin HEAD:feature/rich-trace-export
