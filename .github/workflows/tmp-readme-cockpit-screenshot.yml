name: Temporary README cockpit screenshot

on:
  push:
    branches: [design/cockpit-v2]

permissions:
  contents: write

jobs:
  capture-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/cockpit-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture reproducible README cockpit screenshot
        run: pnpm screenshot:readme
      - name: Commit screenshot and self-remove
        run: |
          rm .github/workflows/tmp-readme-cockpit-screenshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/assets/serve-droid-cockpit.jpg .github/workflows/tmp-readme-cockpit-screenshot.yml
          git commit -m "Refresh cockpit README screenshot"
          git push origin HEAD:design/cockpit-v2
