name: Format two-finger changes

on:
  push:
    branches:
      - feat/two-finger-gestures

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          .changeset/tidy-droids-pinch.md
          docs/protocol.md
          packages/core/src/actions.ts
          packages/core/src/types.ts
          packages/core/test/two-finger-gesture.test.ts
          packages/server/src/control.ts
          packages/server/test/control-routing.test.ts
          packages/server/test/two-finger-control.test.ts
      - name: Commit formatting when needed
        shell: bash
        run: |
          git add \
            .changeset/tidy-droids-pinch.md \
            docs/protocol.md \
            packages/core/src/actions.ts \
            packages/core/src/types.ts \
            packages/core/test/two-finger-gesture.test.ts \
            packages/server/src/control.ts \
            packages/server/test/control-routing.test.ts \
            packages/server/test/two-finger-control.test.ts
          if git diff --cached --quiet; then
            echo "Formatting is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format two-finger gesture changes"
          git push origin HEAD:feat/two-finger-gestures
