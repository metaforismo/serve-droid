name: Temporary rich trace export patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/rich-trace-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/rich-trace-export
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Add trace exporter and self-remove
        run: |
          cat > packages/server/src/trace.ts <<'EOF'
          import { createReadStream } from "node:fs";
          import { open, readFile, rm, stat } from "node:fs/promises";
          import type { FileHandle } from "node:fs/promises";
          import { dirname, join, resolve } from "node:path";
          import { SCHEMA_VERSION, ServeDroidError } from "@serve-droid/core";

          const MAX_MANIFEST_BYTES = 128 * 1024;
          const MAX_EVENT_LINE_BYTES = 64 * 1024;
          const TRACE_PID = 1;

          type FinalRecordingStatus = "completed" | "size-limit" | "time-limit" | "crashed";

          interface TraceRecordingManifest {
            schemaVersion: typeof SCHEMA_VERSION;
            pid: number;
            serial: string;
            startedAt: string;
            endedAt: string | null;
            status: FinalRecordingStatus;
            bytesWritten: number;
            maxBytes: number;
            maxDurationMs: number;
            video: { path: "video.h264"; codec: "h264-annex-b" };
            events: { path: "events.jsonl"; format: "jsonl"; containsLogs: false };
          }

          interface RecordedEvent {
            schemaVersion: typeof SCHEMA_VERSION;
            timestamp: string;
            monotonicUs?: number;
            sequence?: number;
            type: string;
            details: Record<string, unknown>;
          }

          interface TraceEvent {
            name: string;
            cat?: string;
            ph: "M" | "i";
            s?: "p" | "t";
            ts?: number;
            pid: number;
            tid: number;
            args: Record<string, unknown>;
          }

          export interface RecordingTraceExport {
            schemaVersion: typeof SCHEMA_VERSION;
            output: string;
            eventCount: number;
            droppedTrailingBytes: number;
            recordingStatus: FinalRecordingStatus;
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          function nodeCode(error: unknown): string | undefined {
            return isRecord(error) && typeof error.code === "string" ? error.code : undefined;
          }

          function invalid(message: string): ServeDroidError {
            return new ServeDroidError("INVALID_ARGUMENT", message);
          }

          async function readSmallJson(path: string): Promise<unknown> {
            const info = await stat(path);
            if (!info.isFile() || info.size > MAX_MANIFEST_BYTES) {
              throw invalid("Recording manifest is not a bounded regular file.");
            }
            try {
              return JSON.parse(await readFile(path, "utf8")) as unknown;
            } catch (error) {
              if (error instanceof SyntaxError) throw invalid("Recording manifest is malformed JSON.");
              throw error;
            }
          }

          function validateManifest(value: unknown): TraceRecordingManifest {
            if (!isRecord(value)) throw invalid("Recording manifest is malformed.");
            const status = value.status;
            if (
              status !== "completed" &&
              status !== "size-limit" &&
              status !== "time-limit" &&
              status !== "crashed"
            ) {
              throw invalid("Recording must be finalized or recovered before trace export.");
            }
            if (
              value.schemaVersion !== SCHEMA_VERSION ||
              typeof value.serial !== "string" ||
              !Number.isFinite(Date.parse(String(value.startedAt))) ||
              !isRecord(value.video) ||
              value.video.path !== "video.h264" ||
              value.video.codec !== "h264-annex-b" ||
              !isRecord(value.events) ||
              value.events.path !== "events.jsonl" ||
              value.events.format !== "jsonl" ||
              value.events.containsLogs !== false
            ) {
              throw invalid("Recording manifest does not match the serve-droid recording contract.");
            }
            return value as unknown as TraceRecordingManifest;
          }

          async function loadFinalManifest(directory: string): Promise<TraceRecordingManifest> {
            for (const name of ["manifest.json", "manifest.crashed.json"] as const) {
              const path = join(directory, name);
              try {
                return validateManifest(await readSmallJson(path));
              } catch (error) {
                if (nodeCode(error) === "ENOENT") continue;
                throw error;
              }
            }
            try {
              const partial = await stat(join(directory, "manifest.partial.json"));
              if (partial.isFile()) {
                throw invalid("Recording is still active or unrecovered; stop or recover it first.");
              }
            } catch (error) {
              if (error instanceof ServeDroidError) throw error;
              if (nodeCode(error) !== "ENOENT") throw error;
            }
            throw invalid("Directory is not a finalized serve-droid recording.");
          }

          function parseRecordedEvent(line: Buffer): RecordedEvent {
            let value: unknown;
            try {
              value = JSON.parse(line.toString("utf8")) as unknown;
            } catch {
              throw invalid("Recording event stream contains malformed JSON.");
            }
            if (
              !isRecord(value) ||
              value.schemaVersion !== SCHEMA_VERSION ||
              typeof value.timestamp !== "string" ||
              !Number.isFinite(Date.parse(value.timestamp)) ||
              typeof value.type !== "string" ||
              value.type.length === 0 ||
              value.type.length > 128 ||
              !isRecord(value.details) ||
              (value.monotonicUs !== undefined &&
                (!Number.isSafeInteger(value.monotonicUs) || Number(value.monotonicUs) < 0)) ||
              (value.sequence !== undefined &&
                (!Number.isSafeInteger(value.sequence) || Number(value.sequence) < 0))
            ) {
              throw invalid("Recording event stream contains an invalid event envelope.");
            }
            return value as unknown as RecordedEvent;
          }

          function track(type: string): { category: string; tid: number } {
            if (type === "session-start" || type === "session-stop" || type.startsWith("recording-"))
              return { category: "serve-droid.lifecycle", tid: 1 };
            if (type === "action") return { category: "serve-droid.input", tid: 2 };
            if (type === "app" || type === "permission" || type === "file")
              return { category: "serve-droid.device", tid: 3 };
            if (type === "screenshot") return { category: "serve-droid.capture", tid: 4 };
            if (type.startsWith("video-") || type === "display-size")
              return { category: "serve-droid.transport", tid: 5 };
            return { category: "serve-droid.event", tid: 6 };
          }

          function eventName(event: RecordedEvent): string {
            const qualifier =
              event.type === "action"
                ? event.details.action
                : event.type === "app" || event.type === "permission" || event.type === "file"
                  ? event.details.operation
                  : undefined;
            return typeof qualifier === "string" && qualifier.length > 0
              ? `${event.type}:${qualifier}`
              : event.type;
          }

          function sourceTimestampUs(event: RecordedEvent, startedAtMs: number): {
            timestampUs: number;
            timingSource: "monotonic" | "wall-clock";
          } {
            if (Number.isSafeInteger(event.monotonicUs) && Number(event.monotonicUs) >= 0) {
              return { timestampUs: Number(event.monotonicUs), timingSource: "monotonic" };
            }
            return {
              timestampUs: Math.max(0, Math.round((Date.parse(event.timestamp) - startedAtMs) * 1000)),
              timingSource: "wall-clock",
            };
          }

          function metadataEvents(): TraceEvent[] {
            const names = ["Lifecycle", "Input", "Device", "Capture", "Transport", "Events"];
            return [
              {
                name: "process_name",
                ph: "M",
                pid: TRACE_PID,
                tid: 0,
                args: { name: "serve-droid recording" },
              },
              ...names.map((name, index) => ({
                name: "thread_name" as const,
                ph: "M" as const,
                pid: TRACE_PID,
                tid: index + 1,
                args: { name },
              })),
            ];
          }

          async function writeTraceEvent(
            file: FileHandle,
            event: TraceEvent,
            state: { first: boolean },
          ): Promise<void> {
            if (!state.first) await file.write(",\n");
            state.first = false;
            await file.write(JSON.stringify(event));
          }

          export async function exportRecordingTrace(
            recordingDirectory: string,
            outputPath: string,
          ): Promise<RecordingTraceExport> {
            const directory = resolve(recordingDirectory);
            const manifest = await loadFinalManifest(directory);
            const eventsPath = join(directory, "events.jsonl");
            let eventInfo;
            try {
              eventInfo = await stat(eventsPath);
            } catch (error) {
              if (nodeCode(error) === "ENOENT") throw invalid("Recording events.jsonl is missing.");
              throw error;
            }
            if (!eventInfo.isFile()) throw invalid("Recording events.jsonl is not a regular file.");

            const target = resolve(outputPath);
            try {
              const parent = await stat(dirname(target));
              if (!parent.isDirectory()) throw invalid("Trace output parent is not a directory.");
            } catch (error) {
              if (error instanceof ServeDroidError) throw error;
              if (nodeCode(error) === "ENOENT") throw invalid("Trace output parent directory does not exist.");
              throw error;
            }

            let output: FileHandle | undefined;
            let created = false;
            try {
              try {
                output = await open(target, "wx", 0o600);
                created = true;
              } catch (error) {
                if (nodeCode(error) === "EEXIST") {
                  throw invalid("Trace output already exists; choose a new output path.");
                }
                throw error;
              }

              await output.write("[\n");
              const writeState = { first: true };
              for (const event of metadataEvents()) await writeTraceEvent(output, event, writeState);
              await writeTraceEvent(
                output,
                {
                  name: "recording-manifest",
                  cat: "serve-droid.lifecycle",
                  ph: "i",
                  s: "p",
                  ts: 0,
                  pid: TRACE_PID,
                  tid: 1,
                  args: {
                    serial: manifest.serial,
                    status: manifest.status,
                    startedAt: manifest.startedAt,
                    endedAt: manifest.endedAt,
                    bytesWritten: manifest.bytesWritten,
                    maxBytes: manifest.maxBytes,
                    maxDurationMs: manifest.maxDurationMs,
                    videoCodec: manifest.video.codec,
                    sourceEventFormat: manifest.events.format,
                    containsLogs: false,
                  },
                },
                writeState,
              );

              const startedAtMs = Date.parse(manifest.startedAt);
              const stream = createReadStream(eventsPath, { highWaterMark: 16 * 1024 });
              let buffered = Buffer.alloc(0);
              let eventCount = 0;
              let lastTimestampUs = 0;
              let droppedTrailingBytes = 0;

              const consume = async (line: Buffer): Promise<void> => {
                if (line.length === 0) return;
                if (line.length > MAX_EVENT_LINE_BYTES) {
                  throw invalid("Recording event line exceeds the 64 KiB trace-export limit.");
                }
                const normalized = line.at(-1) === 0x0d ? line.subarray(0, -1) : line;
                const event = parseRecordedEvent(normalized);
                const timing = sourceTimestampUs(event, startedAtMs);
                lastTimestampUs = Math.max(lastTimestampUs, timing.timestampUs);
                const placement = track(event.type);
                await writeTraceEvent(
                  output!,
                  {
                    name: eventName(event),
                    cat: placement.category,
                    ph: "i",
                    s: "t",
                    ts: timing.timestampUs,
                    pid: TRACE_PID,
                    tid: placement.tid,
                    args: {
                      ...event.details,
                      eventTimestamp: event.timestamp,
                      eventSequence: event.sequence ?? eventCount,
                      timingSource: timing.timingSource,
                    },
                  },
                  writeState,
                );
                eventCount += 1;
              };

              for await (const chunk of stream) {
                const bytes = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk as Uint8Array);
                buffered = buffered.length === 0 ? bytes : Buffer.concat([buffered, bytes]);
                let newline = buffered.indexOf(0x0a);
                while (newline >= 0) {
                  await consume(buffered.subarray(0, newline));
                  buffered = buffered.subarray(newline + 1);
                  newline = buffered.indexOf(0x0a);
                }
                if (buffered.length > MAX_EVENT_LINE_BYTES) {
                  throw invalid("Recording event line exceeds the 64 KiB trace-export limit.");
                }
              }
              if (buffered.length > 0) {
                if (manifest.status === "crashed") droppedTrailingBytes = buffered.length;
                else throw invalid("Finalized recording ends with an incomplete event line.");
              }

              await writeTraceEvent(
                output,
                {
                  name: "trace-export",
                  cat: "serve-droid.lifecycle",
                  ph: "i",
                  s: "p",
                  ts: lastTimestampUs,
                  pid: TRACE_PID,
                  tid: 1,
                  args: { sourceEventCount: eventCount, droppedTrailingBytes },
                },
                writeState,
              );
              await output.write("\n]\n");
              await output.sync();
              await output.close();
              output = undefined;
              return {
                schemaVersion: SCHEMA_VERSION,
                output: target,
                eventCount,
                droppedTrailingBytes,
                recordingStatus: manifest.status,
              };
            } catch (error) {
              await output?.close().catch(() => undefined);
              if (created) await rm(target, { force: true }).catch(() => undefined);
              throw error;
            }
          }
          EOF

          cat > packages/server/test/trace.test.ts <<'EOF'
          import { mkdir, mkdtemp, readFile, rm, stat, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { afterEach, describe, expect, it } from "vitest";
          import { SessionRecorder } from "../src/recording.js";
          import { exportRecordingTrace } from "../src/trace.js";

          const roots: string[] = [];
          afterEach(async () => {
            await Promise.all(roots.splice(0).map((root) => rm(root, { recursive: true, force: true })));
          });

          async function root(): Promise<string> {
            const path = await mkdtemp(join(tmpdir(), "serve-droid-trace-test-"));
            roots.push(path);
            return path;
          }

          describe("recording trace export", () => {
            it("streams finalized privacy-filtered events into Chrome Trace Event JSON", async () => {
              const parent = await root();
              const recorder = await SessionRecorder.create({
                directory: parent,
                serial: "emulator-5554",
                maxBytes: 1024 * 1024,
                maxDurationMs: 60_000,
              });
              recorder.recordEvent("session-start", { serial: "emulator-5554", width: 1080, height: 1920 });
              recorder.recordEvent("action", { action: "type", textLength: 18 });
              recorder.recordEvent("file", { operation: "push" });
              await recorder.stop();

              const eventLines = (await readFile(join(recorder.status.directory, "events.jsonl"), "utf8"))
                .trim()
                .split("\n")
                .map((line) => JSON.parse(line) as Record<string, unknown>);
              expect(eventLines.map((event) => event.sequence)).toEqual([0, 1, 2]);
              expect(eventLines.every((event) => Number.isSafeInteger(event.monotonicUs))).toBe(true);

              const output = join(parent, "recording.trace.json");
              const result = await exportRecordingTrace(recorder.status.directory, output);
              expect(result).toMatchObject({ eventCount: 3, droppedTrailingBytes: 0, recordingStatus: "completed" });

              const trace = JSON.parse(await readFile(output, "utf8")) as Array<Record<string, unknown>>;
              expect(trace.some((event) => event.name === "process_name" && event.ph === "M")).toBe(true);
              expect(trace).toContainEqual(
                expect.objectContaining({
                  name: "action:type",
                  cat: "serve-droid.input",
                  ph: "i",
                  tid: 2,
                  args: expect.objectContaining({ textLength: 18, timingSource: "monotonic" }),
                }),
              );
              expect(JSON.stringify(trace)).not.toContain("user-secret-text");
              expect(trace.at(-1)).toMatchObject({
                name: "trace-export",
                args: { sourceEventCount: 3, droppedTrailingBytes: 0 },
              });
            });

            it("exports recovered crash data while dropping only a final incomplete event", async () => {
              const parent = await root();
              const directory = join(parent, "session-crashed");
              await mkdir(directory);
              await writeFile(join(directory, "video.h264"), "");
              await writeFile(
                join(directory, "events.jsonl"),
                `${JSON.stringify({
                  schemaVersion: 1,
                  timestamp: "2026-08-19T12:00:00.010Z",
                  type: "video-restart",
                  details: { attempt: 1, maxAttempts: 1 },
                })}\n{"partial":`,
              );
              await writeFile(
                join(directory, "manifest.crashed.json"),
                `${JSON.stringify({
                  schemaVersion: 1,
                  pid: 999999999,
                  serial: "crashed-serial",
                  startedAt: "2026-08-19T12:00:00.000Z",
                  endedAt: "2026-08-19T12:01:00.000Z",
                  status: "crashed",
                  bytesWritten: 128,
                  maxBytes: 1024 * 1024,
                  maxDurationMs: 60_000,
                  video: { path: "video.h264", codec: "h264-annex-b" },
                  events: { path: "events.jsonl", format: "jsonl", containsLogs: false },
                })}\n`,
              );

              const output = join(parent, "crashed.trace.json");
              const result = await exportRecordingTrace(directory, output);
              expect(result.eventCount).toBe(1);
              expect(result.droppedTrailingBytes).toBeGreaterThan(0);
              expect(result.recordingStatus).toBe("crashed");
              const trace = JSON.parse(await readFile(output, "utf8")) as Array<Record<string, unknown>>;
              expect(trace).toContainEqual(
                expect.objectContaining({
                  name: "video-restart",
                  ts: 10_000,
                  args: expect.objectContaining({ timingSource: "wall-clock" }),
                }),
              );
            });

            it("rejects active recordings without leaving a partial trace", async () => {
              const parent = await root();
              const recorder = await SessionRecorder.create({
                directory: parent,
                serial: "active",
                maxBytes: 1024 * 1024,
                maxDurationMs: 60_000,
              });
              const output = join(parent, "active.trace.json");
              await expect(exportRecordingTrace(recorder.status.directory, output)).rejects.toThrow(
                /active|unrecovered|finalized/u,
              );
              await expect(stat(output)).rejects.toThrow();
              await recorder.stop();
            });

            it("fails closed on oversized event lines and removes the output file", async () => {
              const parent = await root();
              const directory = join(parent, "session-oversized");
              await mkdir(directory);
              await writeFile(join(directory, "video.h264"), "");
              await writeFile(join(directory, "events.jsonl"), `${"x".repeat(64 * 1024 + 1)}\n`);
              await writeFile(
                join(directory, "manifest.json"),
                `${JSON.stringify({
                  schemaVersion: 1,
                  pid: 1,
                  serial: "oversized",
                  startedAt: "2026-08-19T12:00:00.000Z",
                  endedAt: "2026-08-19T12:00:01.000Z",
                  status: "completed",
                  bytesWritten: 64 * 1024 + 1,
                  maxBytes: 1024 * 1024,
                  maxDurationMs: 60_000,
                  video: { path: "video.h264", codec: "h264-annex-b" },
                  events: { path: "events.jsonl", format: "jsonl", containsLogs: false },
                })}\n`,
              );
              const output = join(parent, "oversized.trace.json");
              await expect(exportRecordingTrace(directory, output)).rejects.toThrow(/64 KiB/u);
              await expect(stat(output)).rejects.toThrow();
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "packages/server/src/recording.ts",
              '''  #reason: RecordingStopReason = "active";\n  #bytesWritten = 0;''',
              '''  #reason: RecordingStopReason = "active";\n  #bytesWritten = 0;\n  #eventSequence = 0;\n  readonly #startedMonotonic = process.hrtime.bigint();''',
          )
          replace(
              "packages/server/src/recording.ts",
              '''  public recordEvent(type: string, details: Record<string, unknown> = {}): void {\n    if (!this.#active) return;\n    const line = Buffer.from(\n      `${JSON.stringify({ schemaVersion: SCHEMA_VERSION, timestamp: new Date().toISOString(), type, details })}\\n`,\n    );\n    this.#enqueue(this.#events, line);\n  }''',
              '''  public recordEvent(type: string, details: Record<string, unknown> = {}): void {\n    if (!this.#active) return;\n    const monotonicUs = Number((process.hrtime.bigint() - this.#startedMonotonic) / 1000n);\n    const sequence = this.#eventSequence++;\n    const line = Buffer.from(\n      `${JSON.stringify({\n        schemaVersion: SCHEMA_VERSION,\n        timestamp: new Date().toISOString(),\n        monotonicUs,\n        sequence,\n        type,\n        details,\n      })}\\n`,\n    );\n    this.#enqueue(this.#events, line);\n  }''',
          )
          replace(
              "packages/server/src/index.ts",
              '''export * from "./recording.js";\n''',
              '''export * from "./recording.js";\nexport * from "./trace.js";\n''',
          )
          replace(
              "packages/cli/src/index.ts",
              '''import { resolve } from "node:path";''',
              '''import { basename, resolve } from "node:path";''',
          )
          replace(
              "packages/cli/src/index.ts",
              '''  recoverPartialRecordings,\n  removeRecording,''',
              '''  recoverPartialRecordings,\n  exportRecordingTrace,\n  removeRecording,''',
          )
          replace(
              "packages/cli/src/index.ts",
              '''recording\n  .command("remove <session-directory>")''',
              '''recording\n  .command("trace <session-directory>")\n  .description("Export one finalized recording as Chrome Trace Event JSON for Perfetto.")\n  .option("-o, --output <path>", "trace JSON output path")\n  .action(async (directory, local, command) => {\n    const options = globalOptions(command);\n    const source = resolve(directory);\n    const target = resolve(local.output ?? `${basename(source)}.trace.json`);\n    const result = await exportRecordingTrace(source, target);\n    output(result, options, `Exported ${result.eventCount} recording events to ${result.output}.`);\n  });\n\nrecording\n  .command("remove <session-directory>")''',
          )
          replace(
              "docs/recording.md",
              '''- `events.jsonl`: bounded lifecycle and control-event summaries.''',
              '''- `events.jsonl`: bounded lifecycle and control-event summaries. New events include a monotonic\n  microsecond timestamp and sequence number in addition to wall-clock time, so export ordering does\n  not depend on wall-clock adjustments.''',
          )
          replace(
              "docs/recording.md",
              '''## Crash recovery\n''',
              '''## Trace export\n\nA finalized or recovered recording can be exported without decoding the H.264 video:\n\n```sh\nserve-droid recording trace ./recordings/session-emulator-5554-... -o session.trace.json\n```\n\nThe output is streaming Chrome Trace Event JSON that can be opened in Perfetto. Lifecycle, input,\ndevice, capture, and transport events are placed on separate tracks. The exporter reuses only the\nprivacy-filtered metadata already present in `events.jsonl`; it does not add Logcat, tokens, typed\ntext, deep-link URLs, local/remote file paths, or file contents. New recordings use their monotonic\ntimestamps; older recordings fall back to relative wall-clock timestamps.\n\nTrace export refuses active/unrecovered recordings and existing output files, caps each source event\nline at 64 KiB, streams the input instead of loading the entire recording into memory, and deletes a\npartially written trace if validation fails. A recovered crash may end with an incomplete final JSONL\nfragment; only that final unterminated fragment is dropped and its byte count is reported.\n\n## Crash recovery\n''',
          )
          replace(
              "docs/TODO.md",
              '''- [ ] Rich trace export.''',
              '''- [x] Export finalized/recovered recording events as bounded Perfetto-compatible trace JSON.''',
          )
          replace(
              "README.md",
              '''[recording and retention guide](docs/recording.md).''',
              '''[recording and retention guide](docs/recording.md). Finalized recordings can also be exported\nwith `serve-droid recording trace` for timeline inspection in Perfetto.''',
          )
          PY

          pnpm exec prettier --write packages/server/src/trace.ts packages/server/src/recording.ts packages/server/src/index.ts packages/server/test/trace.test.ts packages/cli/src/index.ts docs/recording.md docs/TODO.md README.md .changeset/rich-trace-export.md
          rm .github/workflows/temporary-rich-trace-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Export recordings as trace event JSON"
          git push origin HEAD:feature/rich-trace-export
