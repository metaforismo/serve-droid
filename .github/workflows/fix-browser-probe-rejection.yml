name: Fix browser probe rejection

on:
  push:
    branches:
      - feat/browser-doctor-probe

permissions:
  contents: write

env:
  PNPM_VERSION: 10.28.0

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Attach the internal rejection handler before browser launch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/cli/src/browser-probe.ts")
          content = path.read_text(encoding="utf-8")
          old = "  });\n\n  const server = createServer((request, response) => {\n"
          new = (
              "  });\n"
              "  // A custom launcher may wait for the POST response before returning. Attach a handler\n"
              "  // immediately so an invalid report is never temporarily unhandled; callers still await\n"
              "  // the original promise below and receive the typed failure.\n"
              "  void resultPromise.catch(() => undefined);\n\n"
              "  const server = createServer((request, response) => {\n"
          )
          if new not in content:
              if old not in content:
                  raise SystemExit("result promise marker was not found")
              content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          PY
          pnpm exec prettier --write packages/cli/src/browser-probe.ts
          pnpm exec eslint packages/cli/src/browser-probe.ts
          pnpm exec vitest run packages/cli/test/browser-probe.test.ts
      - name: Commit the lifecycle fix
        shell: bash
        run: |
          git add packages/cli/src/browser-probe.ts
          if git diff --cached --quiet; then
            echo "The lifecycle fix is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Handle early browser probe rejection"
          git push origin HEAD:feat/browser-doctor-probe
