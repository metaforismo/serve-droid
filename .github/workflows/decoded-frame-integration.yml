name: Decoded frame integration

on:
  push:
    branches:
      - feat/decoded-stream-screenshots

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[decoded-frame-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/decoded-stream-screenshots
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@${PNPM_VERSION}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic integrations
        run: |
          python3 scripts/apply-decoded-frame-server-web.py
          python3 scripts/apply-decoded-frame-mcp.py
          if [ -f scripts/harden-decoded-frame.py ]; then
            python3 scripts/harden-decoded-frame.py
          fi
      - name: Verify repository
        run: pnpm verify
      - name: Commit generated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages docs/screenshots.md docs/protocol.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated product changes were needed.'
            exit 0
          fi
          git commit -m 'Harden decoded stream screenshot protocol [decoded-frame-generated]'
          git push origin HEAD:feat/decoded-stream-screenshots
