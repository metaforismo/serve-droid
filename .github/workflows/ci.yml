name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.0

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned package manager
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack

  android-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build Android fixture APK
        working-directory: fixtures/android-test-app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify fixture APK artifact
        shell: bash
        run: |
          test -s fixtures/android-test-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum fixtures/android-test-app/app/build/outputs/apk/debug/app-debug.apk

  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v6
      - name: Install the pinned package manager
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Build fixture for the device scenario
        working-directory: fixtures/android-test-app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm is unavailable; the emulator will use software acceleration."
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: pnpm --filter @serve-droid/core test:device
        env:
          SERVE_DROID_DEVICE_TEST: "1"
          SERVE_DROID_FIXTURE_APK: ${{ github.workspace }}/fixtures/android-test-app/app/build/outputs/apk/debug/app-debug.apk

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the pinned package manager
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install generated-stream test prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm test:browser
