name: Temporary transport patch

on:
  push:
    branches:
      - hardening/public-transport-boundaries

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/public-transport-boundaries
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Apply and format focused server patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/server/src/server.ts")
          text = path.read_text()

          replacements = [
              (
                  'import { basename, extname, join, normalize, resolve } from "node:path";',
                  'import { extname, join, normalize, resolve } from "node:path";',
              ),
              (
                  'import { removeSessionState, writeSessionState } from "./state.js";\n',
                  'import { removeSessionState, writeSessionState } from "./state.js";\n'
                  'import {\n'
                  '  decodeUploadName,\n'
                  '  parseJsonObject,\n'
                  '  sseResumeCursor,\n'
                  '  writeSseLogFrame,\n'
                  '} from "./transport-boundaries.js";\n',
              ),
              (
                  'async function readJson(request: IncomingMessage): Promise<Record<string, unknown>> {\n'
                  '  const body = await readBody(request);\n'
                  '  try {\n'
                  '    return JSON.parse(body.toString("utf8")) as Record<string, unknown>;\n'
                  '  } catch {\n'
                  '    throw new ServeDroidError("INVALID_ARGUMENT", "Request body must be valid JSON.");\n'
                  '  }\n'
                  '}\n',
                  'async function readJson(request: IncomingMessage): Promise<Record<string, unknown>> {\n'
                  '  return parseJsonObject((await readBody(request)).toString("utf8"));\n'
                  '}\n',
              ),
              (
                  '  async #serveLogs(\n'
                  '    request: IncomingMessage,\n'
                  '    response: ServerResponse,\n'
                  '    since: string,\n'
                  '    packageName?: string,\n'
                  '  ): Promise<void> {\n'
                  '    const initial = await this.service.readLogs(since, packageName);\n'
                  '    response.writeHead(200, {\n'
                  '      "content-type": "text/event-stream",\n'
                  '      "cache-control": "no-store",\n'
                  '      connection: "keep-alive",\n'
                  '    });\n'
                  '    const write = (entry: unknown) => response.write(`data: ${JSON.stringify(entry)}\\n\\n`);\n'
                  '    for (const entry of initial.entries) write(entry);\n'
                  '    const unsubscribe = this.service.subscribeLogs(packageName, write);\n'
                  '    request.once("close", unsubscribe);\n'
                  '  }\n',
                  '  async #serveLogs(\n'
                  '    request: IncomingMessage,\n'
                  '    response: ServerResponse,\n'
                  '    since: string,\n'
                  '    packageName?: string,\n'
                  '  ): Promise<void> {\n'
                  '    const resumeFrom = sseResumeCursor(since, request.headers["last-event-id"]);\n'
                  '    const initial = await this.service.readLogs(resumeFrom, packageName);\n'
                  '    response.writeHead(200, {\n'
                  '      "content-type": "text/event-stream",\n'
                  '      "cache-control": "no-store",\n'
                  '      connection: "keep-alive",\n'
                  '    });\n'
                  '    let unsubscribe: (() => void) | undefined;\n'
                  '    const write = (entry: Parameters<typeof writeSseLogFrame>[1]): boolean => {\n'
                  '      const writable = writeSseLogFrame(response, entry);\n'
                  '      if (!writable) {\n'
                  '        unsubscribe?.();\n'
                  '        unsubscribe = undefined;\n'
                  '      }\n'
                  '      return writable;\n'
                  '    };\n'
                  '    for (const entry of initial.entries) {\n'
                  '      if (!write(entry)) return;\n'
                  '    }\n'
                  '    unsubscribe = this.service.subscribeLogs(packageName, (entry) => void write(entry));\n'
                  '    request.once("close", () => {\n'
                  '      unsubscribe?.();\n'
                  '      unsubscribe = undefined;\n'
                  '    });\n'
                  '  }\n',
              ),
              (
                  '    const encodedName = String(request.headers["x-file-name"] ?? "");\n'
                  '    const name = basename(decodeURIComponent(encodedName));\n'
                  '    if (!name || name === "." || name === "..")\n'
                  '      throw new ServeDroidError("INVALID_ARGUMENT", "x-file-name is required.");\n',
                  '    const name = decodeUploadName(String(request.headers["x-file-name"] ?? ""));\n',
              ),
              (
                  '      const result = await this.#action(JSON.parse(raw) as Record<string, unknown>);',
                  '      const result = await this.#action(parseJsonObject(raw));',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected server.ts block not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          pnpm exec prettier --write packages/server/src/server.ts
          rm .github/workflows/temporary-transport-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/server/src/server.ts .github/workflows/temporary-transport-patch.yml
          git diff --cached --quiet || git commit -m "Integrate bounded transport boundaries"
          git push origin HEAD:hardening/public-transport-boundaries
