name: Temporary browser recording controls patch

on:
  push:
    branches:
      - feature/browser-recording-controls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/browser-recording-controls
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Apply recording controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Reuse recording option validation when controls are authorized but recording is not auto-started.
          replace(
              "packages/server/src/recording.ts",
              '''export class SessionRecorder {\n''',
              '''export function validateRecordingOptions(\n  options: Pick<RecordingOptions, "maxBytes" | "maxDurationMs">,\n): void {\n  if (!Number.isSafeInteger(options.maxBytes) || options.maxBytes < 1024 * 1024) {\n    throw new ServeDroidError("INVALID_ARGUMENT", "Recording maxBytes must be at least 1 MiB.");\n  }\n  if (!Number.isSafeInteger(options.maxDurationMs) || options.maxDurationMs < 1_000) {\n    throw new ServeDroidError(\n      "INVALID_ARGUMENT",\n      "Recording maxDurationMs must be at least 1 second.",\n    );\n  }\n}\n\nexport class SessionRecorder {\n''',
          )
          replace(
              "packages/server/src/recording.ts",
              '''  public static async create(options: RecordingOptions): Promise<SessionRecorder> {\n    if (!Number.isSafeInteger(options.maxBytes) || options.maxBytes < 1024 * 1024) {\n      throw new ServeDroidError("INVALID_ARGUMENT", "Recording maxBytes must be at least 1 MiB.");\n    }\n    if (!Number.isSafeInteger(options.maxDurationMs) || options.maxDurationMs < 1_000) {\n      throw new ServeDroidError(\n        "INVALID_ARGUMENT",\n        "Recording maxDurationMs must be at least 1 second.",\n      );\n    }\n    const root = resolve(options.directory);\n''',
              '''  public static async create(options: RecordingOptions): Promise<SessionRecorder> {\n    validateRecordingOptions(options);\n    const root = resolve(options.directory);\n''',
          )

          # Server configuration and serialized browser-controlled lifecycle.
          replace(
              "packages/server/src/server.ts",
              '''import { SessionRecorder, type RecordingOptions, type RecordingStatus } from "./recording.js";''',
              '''import {\n  SessionRecorder,\n  validateRecordingOptions,\n  type RecordingOptions,\n  type RecordingStatus,\n} from "./recording.js";''',
          )
          replace(
              "packages/server/src/server.ts",
              '''  recording?: Omit<RecordingOptions, "serial">;\n  audio?: boolean;''',
              '''  recording?: Omit<RecordingOptions, "serial">;\n  recordingControl?: Omit<RecordingOptions, "serial">;\n  audio?: boolean;''',
          )
