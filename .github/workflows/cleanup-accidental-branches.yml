name: Cleanup accidental branches

on:
  push:
    branches:
      - ci/android-fixture-wrapper

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[branches-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove accidental empty branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            accidental-cleanup-placeholder \
            __ignore__ \
            noop \
            stop \
            why-did-i-create-this
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
