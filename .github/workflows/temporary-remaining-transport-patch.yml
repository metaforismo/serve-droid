name: Temporary remaining transport patch

on:
  push:
    branches:
      - hardening/remaining-transport-bounds

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/remaining-transport-bounds
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: Integrate bounded MCP stdio and video backpressure helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mcp = Path("packages/mcp/src/server.ts")
          text = mcp.read_text()
          old = 'import { StdioServerTransport } from "@modelcontextprotocol/sdk/server/stdio.js";\n'
          if old not in text:
              raise SystemExit("MCP stdio import not found")
          text = text.replace(old, 'import { BoundedStdioServerTransport } from "./bounded-stdio.js";\n', 1)
          old = "  await server.connect(new StdioServerTransport());"
          if old not in text:
              raise SystemExit("MCP run transport not found")
          text = text.replace(old, "  await server.connect(new BoundedStdioServerTransport());", 1)
          mcp.write_text(text)

          server = Path("packages/server/src/server.ts")
          text = server.read_text()
          old = "const DEFAULT_VIDEO_CLIENT_LIMIT = 2;"
          new = "const DEFAULT_VIDEO_CLIENT_LIMIT = 2;\nconst VIDEO_BACKPRESSURE_BYTES = 4 * 1024 * 1024;"
          if old not in text:
              raise SystemExit("video client limit constant not found")
          text = text.replace(old, new, 1)
          old = """export function canSendAudio(bufferedAmount: number): boolean {\n  return Number.isFinite(bufferedAmount) && bufferedAmount >= 0 && bufferedAmount < 512 * 1024;\n}\n"""
          new = old + """\nexport function canSendVideo(bufferedAmount: number): boolean {\n  return (\n    Number.isFinite(bufferedAmount) &&\n    bufferedAmount >= 0 &&\n    bufferedAmount < VIDEO_BACKPRESSURE_BYTES\n  );\n}\n"""
          if old not in text:
              raise SystemExit("audio backpressure helper not found")
          text = text.replace(old, new, 1)
          old = """        if (client.readyState === WebSocket.OPEN && client.bufferedAmount < 4 * 1024 * 1024)\n          client.send(chunk);"""
          new = """        if (client.readyState === WebSocket.OPEN && canSendVideo(client.bufferedAmount))\n          client.send(chunk);"""
          if old not in text:
              raise SystemExit("video send bound not found")
          text = text.replace(old, new, 1)
          server.write_text(text)

          test = Path("packages/server/test/server.test.ts")
          text = test.read_text()
          old = 'import { canSendAudio, encodeAudioPacket, ServeDroidServer } from "../src/server.js";'
          new = '''import {\n  canSendAudio,\n  canSendVideo,\n  encodeAudioPacket,\n  ServeDroidServer,\n} from "../src/server.js";'''
          if old not in text:
              raise SystemExit("server test import not found")
          text = text.replace(old, new, 1)
          old = """  it(\"bounds socket backpressure\", () => {\n    expect(canSendAudio(0)).toBe(true);\n    expect(canSendAudio(512 * 1024 - 1)).toBe(true);\n    expect(canSendAudio(512 * 1024)).toBe(false);\n    expect(canSendAudio(Number.POSITIVE_INFINITY)).toBe(false);\n  });\n"""
          new = old + """\n  it(\"bounds video socket backpressure\", () => {\n    expect(canSendVideo(0)).toBe(true);\n    expect(canSendVideo(4 * 1024 * 1024 - 1)).toBe(true);\n    expect(canSendVideo(4 * 1024 * 1024)).toBe(false);\n    expect(canSendVideo(Number.NaN)).toBe(false);\n    expect(canSendVideo(Number.POSITIVE_INFINITY)).toBe(false);\n  });\n"""
          if old not in text:
              raise SystemExit("audio backpressure test block not found")
          test.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/mcp/src/server.ts packages/mcp/src/bounded-stdio.ts packages/mcp/test/bounded-stdio.test.ts packages/server/src/server.ts packages/server/test/server.test.ts
          rm .github/workflows/temporary-remaining-transport-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/mcp/src/server.ts packages/mcp/src/bounded-stdio.ts packages/mcp/test/bounded-stdio.test.ts packages/server/src/server.ts packages/server/test/server.test.ts .github/workflows/temporary-remaining-transport-patch.yml
          git diff --cached --quiet || git commit -m "Integrate remaining transport bounds"
          git push origin HEAD:hardening/remaining-transport-bounds
